<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg">
  <g font-family="Consolas, monospace">

    <!-- horizontal gridlines: 0,25,50,75,100% -->
    <g stroke="rgba(255,255,255,.08)" stroke-width="1">
      <line x1="40" y1="360" x2="730" y2="360"/>
      <line x1="40" y1="290" x2="730" y2="290"/>
      <line x1="40" y1="220" x2="730" y2="220"/>
      <line x1="40" y1="150" x2="730" y2="150"/>
      <line x1="40" y1="80"  x2="730" y2="80"/>
    </g>
    <g fill="#94a3b8" font-size="12" text-anchor="end">
      <text x="34" y="364">0%</text>
      <text x="34" y="294">25%</text>
      <text x="34" y="224">50%</text>
      <text x="34" y="154">75%</text>
      <text x="34" y="84">100%</text>
    </g>

    <!-- BioGated reference line -->
    <line x1="40" y1="97.2" x2="730" y2="97.2" stroke="#22d3ee" stroke-width="1" stroke-dasharray="5,4" opacity="0.6"/>

    <!-- bars -->
    <g>
      <rect x="70"  y="97.2"  width="60" height="262.8" fill="rgba(34,211,238,0.30)" stroke="#22d3ee" stroke-width="2"/>
      <rect x="170" y="97.6"  width="60" height="262.4" fill="rgba(249,115,22,0.22)" stroke="#f97316" stroke-width="2" stroke-dasharray="4,3"/>
      <rect x="270" y="207.9" width="60" height="152.1" fill="rgba(239,68,68,0.28)"  stroke="#ef4444" stroke-width="2"/>
      <rect x="370" y="97.4"  width="60" height="262.6" fill="rgba(249,115,22,0.30)" stroke="#f97316" stroke-width="2"/>
      <rect x="470" y="91.4"  width="60" height="268.6" fill="rgba(34,197,94,0.28)"  stroke="#22c55e" stroke-width="2"/>
      <rect x="570" y="93.5"  width="60" height="266.5" fill="rgba(34,197,94,0.20)"  stroke="#22c55e" stroke-width="2" stroke-dasharray="4,3"/>
      <rect x="670" y="89.7"  width="60" height="270.3" fill="rgba(34,197,94,0.28)"  stroke="#22c55e" stroke-width="2"/>
    </g>

    <!-- value labels -->
    <g fill="#e2e8f0" font-size="13" font-weight="bold" text-anchor="middle">
      <text x="100" y="88">93.84%</text>
      <text x="200" y="88">93.72%</text>
      <text x="300" y="198">54.31%</text>
      <text x="400" y="88">93.78%</text>
      <text x="500" y="82">95.92%</text>
      <text x="600" y="84">95.18%</text>
      <text x="700" y="80">96.53%</text>
    </g>

    <!-- model names -->
    <g fill="#e2e8f0" font-size="12.5" text-anchor="middle">
      <text x="100" y="380">BioGated</text>
      <text x="200" y="380">NoGate</text>
      <text x="300" y="380">EEG-only</text>
      <text x="400" y="380">EMG-only</text>
      <text x="500" y="380">CNN1D</text>
      <text x="600" y="380">LSTM</text>
      <text x="700" y="380">SVM</text>
    </g>

    <!-- p-value annotations vs BioGated -->
    <g fill="#64748b" font-size="11" text-anchor="middle">
      <text x="100" y="396">(önerilen)</text>
      <text x="200" y="396">p=0.79</text>
      <text x="300" y="396">p=0.0005</text>
      <text x="400" y="396">p=0.86</text>
      <text x="500" y="396">p=0.0049</text>
      <text x="600" y="396">p=0.27</text>
      <text x="700" y="396">p=0.0005</text>
    </g>

    <text x="380" y="415" fill="#64748b" font-size="12" text-anchor="middle">
      LOSO (12 kat) — Wilcoxon p, BioGatedSNN'e karşı. Kırmızı = anlamlı derecede kötü, yeşil = anlamlı derecede iyi.
    </text>
  </g>
</svg>
