<svg viewBox="0 0 760 220" xmlns="http://www.w3.org/2000/svg">
  <g font-family="Consolas, monospace">
    <!-- axis -->
    <line x1="40" y1="120" x2="720" y2="120" stroke="rgba(255,255,255,.2)" stroke-width="2"/>
    <!-- ticks every 0.5s from -2 to +2, LEDon at x=380 -->
    <g stroke="rgba(255,255,255,.25)" stroke-width="1.5">
      <line x1="40"  y1="114" x2="40"  y2="126"/>
      <line x1="125" y1="114" x2="125" y2="126"/>
      <line x1="210" y1="114" x2="210" y2="126"/>
      <line x1="295" y1="114" x2="295" y2="126"/>
      <line x1="380" y1="106" x2="380" y2="134"/>
      <line x1="465" y1="114" x2="465" y2="126"/>
      <line x1="550" y1="114" x2="550" y2="126"/>
      <line x1="635" y1="114" x2="635" y2="126"/>
      <line x1="720" y1="114" x2="720" y2="126"/>
    </g>
    <g fill="#94a3b8" font-size="12" text-anchor="middle">
      <text x="40"  y="145">-2.0s</text>
      <text x="125" y="145">-1.5s</text>
      <text x="210" y="145">-1.0s</text>
      <text x="295" y="145">-0.5s</text>
      <text x="380" y="150" fill="#e2e8f0" font-weight="bold">LEDon</text>
      <text x="465" y="145">+0.5s</text>
      <text x="550" y="145">+1.0s</text>
      <text x="635" y="145">+1.5s</text>
      <text x="720" y="145">+2.0s</text>
    </g>
    <line x1="380" y1="40" x2="380" y2="120" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="5,4"/>

    <!-- REST window: -1.5 to -0.5 -> x 125 to 295 -->
    <rect x="125" y="88" width="170" height="32" rx="4" fill="rgba(34,211,238,0.25)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="210" y="75" fill="#22d3ee" font-size="13" font-weight="bold" text-anchor="middle">REST</text>
    <text x="210" y="108" fill="#e2e8f0" font-size="11.5" text-anchor="middle">[-1.5s, -0.5s]</text>

    <!-- GRASP window: +0.5 to +1.5 -> x 465 to 635 -->
    <rect x="465" y="88" width="170" height="32" rx="4" fill="rgba(249,115,22,0.25)" stroke="#f97316" stroke-width="1.5"/>
    <text x="550" y="75" fill="#f97316" font-size="13" font-weight="bold" text-anchor="middle">GRASP</text>
    <text x="550" y="108" fill="#e2e8f0" font-size="11.5" text-anchor="middle">[+0.5s, +1.5s]</text>

    <text x="380" y="30" fill="#64748b" font-size="12.5" text-anchor="middle">
      her deneme kendi bağımsız penceresini üretir — kaydırmalı pencere otokorelasyonu yok
    </text>
    <text x="380" y="195" fill="#64748b" font-size="12" text-anchor="middle">
      12 katılımcı × 108 oturum × 3528 deneme → 7056 bağımsız pencere (3528 REST + 3528 GRASP)
    </text>
  </g>
</svg>
