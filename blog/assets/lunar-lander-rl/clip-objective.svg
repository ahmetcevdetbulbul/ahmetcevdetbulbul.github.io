<svg viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg">
  <g font-family="Consolas, monospace">

    <!-- ============ Panel 1: A > 0 ============ -->
    <text x="180" y="24" fill="#e2e8f0" font-size="14" font-weight="bold" text-anchor="middle">Â &gt; 0  (eylem beklenenden iyiydi)</text>

    <!-- grid -->
    <g stroke="rgba(255,255,255,.08)" stroke-width="1">
      <line x1="50" y1="260" x2="320" y2="260"/>
      <line x1="50" y1="160" x2="320" y2="160"/>
      <line x1="50" y1="60"  x2="320" y2="60"/>
    </g>
    <line x1="50" y1="50" x2="50" y2="260" stroke="rgba(255,255,255,.25)"/>
    <!-- epsilon markers -->
    <g stroke="rgba(148,163,184,.45)" stroke-dasharray="3,4">
      <line x1="154" y1="50" x2="154" y2="260"/>
      <line x1="180" y1="50" x2="180" y2="260"/>
      <line x1="206" y1="50" x2="206" y2="260"/>
    </g>
    <g fill="#94a3b8" font-size="11.5" text-anchor="middle">
      <text x="154" y="278">1−ε</text>
      <text x="180" y="278">1</text>
      <text x="206" y="278">1+ε</text>
      <text x="50"  y="278">0</text>
      <text x="310" y="278">2</text>
    </g>
    <text x="185" y="300" fill="#64748b" font-size="12" text-anchor="middle">oran  r = π_θ(a|s) / π_eski(a|s)</text>

    <!-- unclipped r*A (dashed) -->
    <polyline points="50,260 310,60" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6,5"/>
    <text x="268" y="62" fill="#64748b" font-size="11.5" text-anchor="end">r·Â  (kırpılmamış)</text>
    <!-- L^CLIP -->
    <polyline points="50,260 206,140 310,140" fill="none" stroke="#22d3ee" stroke-width="3.2"/>
    <circle cx="206" cy="140" r="5" fill="#22d3ee"/>
    <text x="262" y="130" fill="#22d3ee" font-size="12.5" font-weight="bold" text-anchor="middle">gradyan = 0</text>
    <text x="262" y="157" fill="#67e8f9" font-size="11.5" text-anchor="middle">(ödül yeter, dur)</text>

    <!-- ============ Panel 2: A < 0 ============ -->
    <text x="560" y="24" fill="#e2e8f0" font-size="14" font-weight="bold" text-anchor="middle">Â &lt; 0  (eylem beklenenden kötüydü)</text>

    <g stroke="rgba(255,255,255,.08)" stroke-width="1">
      <line x1="430" y1="260" x2="700" y2="260"/>
      <line x1="430" y1="160" x2="700" y2="160"/>
      <line x1="430" y1="60"  x2="700" y2="60"/>
    </g>
    <line x1="430" y1="50" x2="430" y2="260" stroke="rgba(255,255,255,.25)"/>
    <g stroke="rgba(148,163,184,.45)" stroke-dasharray="3,4">
      <line x1="534" y1="50" x2="534" y2="260"/>
      <line x1="560" y1="50" x2="560" y2="260"/>
      <line x1="586" y1="50" x2="586" y2="260"/>
    </g>
    <g fill="#94a3b8" font-size="11.5" text-anchor="middle">
      <text x="534" y="278">1−ε</text>
      <text x="560" y="278">1</text>
      <text x="586" y="278">1+ε</text>
      <text x="430" y="278">0</text>
      <text x="690" y="278">2</text>
    </g>
    <text x="565" y="300" fill="#64748b" font-size="12" text-anchor="middle">oran  r = π_θ(a|s) / π_eski(a|s)</text>

    <!-- kırpılmamış r*Â (kesikli): L = -r -->
    <polyline points="430,60 690,260" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6,5"/>
    <!-- L^CLIP for A<0: flat at -0.8 for r<0.8, then -r -->
    <polyline points="430,140 534,140 690,260" fill="none" stroke="#f97316" stroke-width="3.2"/>
    <circle cx="534" cy="140" r="5" fill="#f97316"/>
    <text x="478" y="128" fill="#f97316" font-size="12.5" font-weight="bold" text-anchor="middle">gradyan = 0</text>
    <text x="478" y="170" fill="#fdba74" font-size="11.5" text-anchor="middle">(yeterince azalttın)</text>
    <text x="650" y="200" fill="#fdba74" font-size="11.5" text-anchor="middle">r büyürse ceza sürer</text>

    <text x="380" y="330" fill="#64748b" font-size="12" text-anchor="middle">L^CLIP = min( r·Â , clip(r, 1−ε, 1+ε)·Â ),  ε = 0.2</text>
  </g>
</svg>
