<svg viewBox="0 0 860 400" xmlns="http://www.w3.org/2000/svg"><defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
<marker id="ahc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/></marker></defs>
<g font-family="Consolas, Menlo, monospace">
<rect x="14" y="44" width="220" height="100" rx="12" fill="rgba(59,130,246,0.12)" stroke="#60a5fa" stroke-width="1.8"/>
<text x="124.0" y="74" fill="#60a5fa" font-size="14" font-weight="bold" text-anchor="middle">1 · ENVIRONMENT</text>
<text x="124.0" y="100" fill="#e2e8f0" font-size="12" text-anchor="middle">8 parallel Lunar Landers</text>
<text x="124.0" y="122" fill="#94a3b8" font-size="11.5" text-anchor="middle">s_t → physics → r_t, s_t+1</text>
<rect x="320" y="44" width="220" height="100" rx="12" fill="rgba(34,211,238,0.12)" stroke="#22d3ee" stroke-width="1.8"/>
<text x="430.0" y="74" fill="#22d3ee" font-size="14" font-weight="bold" text-anchor="middle">2 · POLICY</text>
<text x="430.0" y="100" fill="#e2e8f0" font-size="12" text-anchor="middle">π_θ(a|s) → sample action</text>
<text x="430.0" y="122" fill="#94a3b8" font-size="11.5" text-anchor="middle">store log π(a|s) and V(s)</text>
<rect x="626" y="44" width="220" height="100" rx="12" fill="rgba(168,85,247,0.12)" stroke="#c084fc" stroke-width="1.8"/>
<text x="736.0" y="74" fill="#c084fc" font-size="14" font-weight="bold" text-anchor="middle">3 · BUFFER</text>
<text x="736.0" y="100" fill="#e2e8f0" font-size="12" text-anchor="middle">8 envs × 256 steps</text>
<text x="736.0" y="122" fill="#94a3b8" font-size="11.5" text-anchor="middle">= 2048 transitions</text>
<rect x="626" y="244" width="220" height="100" rx="12" fill="rgba(245,158,11,0.12)" stroke="#fbbf24" stroke-width="1.8"/>
<text x="736.0" y="274" fill="#fbbf24" font-size="14" font-weight="bold" text-anchor="middle">4 · ADVANTAGE</text>
<text x="736.0" y="300" fill="#e2e8f0" font-size="12" text-anchor="middle">GAE(γ=0.99, λ=0.95)</text>
<text x="736.0" y="322" fill="#94a3b8" font-size="11.5" text-anchor="middle">Â_t and R̂_t = Â_t + V(s_t)</text>
<rect x="320" y="244" width="220" height="100" rx="12" fill="rgba(34,197,94,0.12)" stroke="#4ade80" stroke-width="1.8"/>
<text x="430.0" y="274" fill="#4ade80" font-size="14" font-weight="bold" text-anchor="middle">5 · PPO UPDATE</text>
<text x="430.0" y="300" fill="#e2e8f0" font-size="12" text-anchor="middle">4 epochs × 16 mini-batches</text>
<text x="430.0" y="322" fill="#94a3b8" font-size="11.5" text-anchor="middle">clipped loss + Adam</text>
<rect x="14" y="244" width="220" height="100" rx="12" fill="rgba(255,255,255,0.05)" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="5,4"/>
<text x="124.0" y="274" fill="#94a3b8" font-size="14" font-weight="bold" text-anchor="middle">6 · NEW θ, φ</text>
<text x="124.0" y="300" fill="#e2e8f0" font-size="12" text-anchor="middle">better policy</text>
<text x="124.0" y="322" fill="#94a3b8" font-size="11.5" text-anchor="middle">→ back to step 1</text>
<line x1="236" y1="80.0" x2="316" y2="80.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)"/>
<text x="277.0" y="70.0" fill="#94a3b8" font-size="11.5" text-anchor="middle">s_t</text>
<path d="M318,110.0 C280,146.0 274,146.0 238,110.0" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)"/>
<text x="277.0" y="160.0" fill="#94a3b8" font-size="11.5" text-anchor="middle">a_t</text>
<line x1="542" y1="94.0" x2="622" y2="94.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)"/>
<text x="583.0" y="84.0" fill="#94a3b8" font-size="11.5" text-anchor="middle">(s,a,r,…)</text>
<line x1="736.0" y1="146" x2="736.0" y2="240" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)"/>
<text x="750.0" y="198.0" fill="#94a3b8" font-size="11.5">2048</text>
<line x1="624" y1="294.0" x2="544" y2="294.0" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)"/>
<text x="583.0" y="284.0" fill="#94a3b8" font-size="11.5" text-anchor="middle">Â, R̂</text>
<line x1="318" y1="294.0" x2="238" y2="294.0" stroke="#22d3ee" stroke-width="2.4" marker-end="url(#ahc)"/>
<text x="277.0" y="284.0" fill="#22d3ee" font-size="11.5" text-anchor="middle">∇θ L</text>
<line x1="124.0" y1="242" x2="124.0" y2="148" stroke="#22d3ee" stroke-width="2.4" marker-end="url(#ahc)"/>
<text x="138.0" y="198.0" fill="#22d3ee" font-size="11.5">loop</text>
<text x="430.0" y="376" fill="#64748b" font-size="12" text-anchor="middle">One “iteration” = one full turn of this loop. The number in the demo sets how many turns it runs.</text>
</g></svg>