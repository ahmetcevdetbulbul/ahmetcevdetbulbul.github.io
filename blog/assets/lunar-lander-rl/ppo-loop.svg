<svg viewBox="0 0 780 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="ahc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/>
    </marker>
  </defs>
  <g font-family="Consolas, monospace">

    <!-- 1) Ortam -->
    <rect x="20" y="40" width="170" height="86" rx="12" fill="rgba(59,130,246,0.12)" stroke="#3b82f6" stroke-width="1.8"/>
    <text x="105" y="66" fill="#93c5fd" font-size="14" font-weight="bold" text-anchor="middle">1 · ORTAM</text>
    <text x="105" y="87" fill="#e2e8f0" font-size="12" text-anchor="middle">8 paralel Lunar Lander</text>
    <text x="105" y="106" fill="#94a3b8" font-size="11.5" text-anchor="middle">s_t → fizik → r_t, s_t+1</text>

    <!-- 2) Aktör -->
    <rect x="300" y="40" width="170" height="86" rx="12" fill="rgba(34,211,238,0.12)" stroke="#22d3ee" stroke-width="1.8"/>
    <text x="385" y="66" fill="#67e8f9" font-size="14" font-weight="bold" text-anchor="middle">2 · POLİTİKA</text>
    <text x="385" y="87" fill="#e2e8f0" font-size="12" text-anchor="middle">π_θ(a|s) → örnekle</text>
    <text x="385" y="106" fill="#94a3b8" font-size="11.5" text-anchor="middle">log π(a|s) ve V(s) kaydet</text>

    <!-- 3) Tampon -->
    <rect x="580" y="40" width="180" height="86" rx="12" fill="rgba(168,85,247,0.12)" stroke="#a855f7" stroke-width="1.8"/>
    <text x="670" y="66" fill="#d8b4fe" font-size="14" font-weight="bold" text-anchor="middle">3 · TAMPON</text>
    <text x="670" y="87" fill="#e2e8f0" font-size="12" text-anchor="middle">8 ortam × 256 adım</text>
    <text x="670" y="106" fill="#94a3b8" font-size="11.5" text-anchor="middle">= 2048 geçiş (s,a,r,log π,V)</text>

    <!-- 4) GAE -->
    <rect x="580" y="230" width="180" height="86" rx="12" fill="rgba(245,158,11,0.12)" stroke="#f59e0b" stroke-width="1.8"/>
    <text x="670" y="256" fill="#fcd34d" font-size="14" font-weight="bold" text-anchor="middle">4 · AVANTAJ</text>
    <text x="670" y="277" fill="#e2e8f0" font-size="12" text-anchor="middle">GAE(γ=0.99, λ=0.95)</text>
    <text x="670" y="296" fill="#94a3b8" font-size="11.5" text-anchor="middle">Â_t  ve  R̂_t = Â_t + V(s_t)</text>

    <!-- 5) Güncelleme -->
    <rect x="300" y="230" width="170" height="86" rx="12" fill="rgba(34,197,94,0.12)" stroke="#22c55e" stroke-width="1.8"/>
    <text x="385" y="256" fill="#86efac" font-size="14" font-weight="bold" text-anchor="middle">5 · PPO GÜNCELLEME</text>
    <text x="385" y="277" fill="#e2e8f0" font-size="12" text-anchor="middle">4 epoch × 16 mini-batch</text>
    <text x="385" y="296" fill="#94a3b8" font-size="11.5" text-anchor="middle">kırpılmış kayıp + Adam</text>

    <!-- 6) Yeni parametreler -->
    <rect x="20" y="230" width="170" height="86" rx="12" fill="rgba(255,255,255,0.05)" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>
    <text x="105" y="256" fill="#e2e8f0" font-size="14" font-weight="bold" text-anchor="middle">6 · YENİ θ, φ</text>
    <text x="105" y="277" fill="#94a3b8" font-size="12" text-anchor="middle">daha iyi politika</text>
    <text x="105" y="296" fill="#94a3b8" font-size="11.5" text-anchor="middle">→ tekrar 1. adım</text>

    <!-- oklar -->
    <line x1="192" y1="83" x2="296" y2="83" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)"/>
    <text x="244" y="74" fill="#94a3b8" font-size="11.5" text-anchor="middle">s_t</text>
    <path d="M300,111 C260,150 230,150 192,111" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)"/>
    <text x="246" y="158" fill="#94a3b8" font-size="11.5" text-anchor="middle">a_t</text>

    <line x1="472" y1="83" x2="576" y2="83" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)"/>
    <text x="524" y="74" fill="#94a3b8" font-size="11.5" text-anchor="middle">(s,a,r,…)</text>

    <line x1="670" y1="128" x2="670" y2="226" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)"/>
    <text x="728" y="182" fill="#94a3b8" font-size="11.5" text-anchor="middle">2048</text>

    <line x1="576" y1="273" x2="474" y2="273" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)"/>
    <text x="525" y="264" fill="#94a3b8" font-size="11.5" text-anchor="middle">Â, R̂</text>

    <line x1="296" y1="273" x2="194" y2="273" stroke="#22d3ee" stroke-width="2.4" marker-end="url(#ahc)"/>
    <text x="245" y="264" fill="#22d3ee" font-size="11.5" text-anchor="middle">∇θ L</text>

    <line x1="105" y1="228" x2="105" y2="130" stroke="#22d3ee" stroke-width="2.4" marker-end="url(#ahc)"/>
    <text x="64" y="182" fill="#22d3ee" font-size="11.5" text-anchor="middle">döngü</text>

    <text x="390" y="344" fill="#64748b" font-size="12" text-anchor="middle">“İterasyon” = bu döngünün bir turu. Arayüzdeki sayı kaç tur döneceğini belirler.</text>
  </g>
</svg>
